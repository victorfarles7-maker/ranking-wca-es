<head>
  <meta charset="UTF-8">
  <title>Ranking WCA ES</title>
  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="icons/cubing-icons.css">
</head>
<body>
  
  <h1> <img src="icons/wca.png" alt="WCA" class="wca-logo"> Rankings WCA - Espírito Santo <img src="icons/es.svg" alt="Bandeira do Espírito Santo" class="es-flag"></h1>
  <div class="tabs">
    <button onclick="mostrarRanking('capixabas')">Capixabas com mais Medalhas</button>
    <button onclick="mostrarRanking('campeonatos')">Coleção de Medalhas nos Campeonatos ES</button>
    <button onclick="mostrarRanking('recordes')">Recordes Capixabas (ESR)</button>
  </div>

  <input type="text" id="busca" placeholder="Buscar nome..." onkeyup="filtrar()">

  <div id="ranking"></div>

  <script src="app.js"></script>
</body>
</html>
